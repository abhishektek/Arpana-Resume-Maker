<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arpana Resume Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fb;--surface:#fff;--ink:#0f172a;--muted:#64748b;--line:#e5e9f2;--pri:#4f46e5;--pri2:#6366f1;--soft:#eef0ff;--danger:#dc2626;--shadow:0 1px 3px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.05);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--surface:#141a2e;--ink:#e8ecf8;--muted:#94a3c0;--line:#252d47;--soft:#1c2347;--shadow:0 8px 24px rgba(0,0,0,.35)}}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
.mi{font-family:'Material Symbols Outlined';font-weight:400;font-style:normal;font-size:20px;line-height:1;display:inline-block;vertical-align:middle;letter-spacing:normal;text-transform:none;white-space:nowrap;direction:ltr;-webkit-font-feature-settings:'liga';font-feature-settings:'liga';user-select:none}
button{font:inherit;font-size:13px;font-weight:600;border:0;border-radius:10px;padding:8px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.15s;white-space:nowrap}
button:active{transform:scale(.96)}
.b-pri{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;box-shadow:0 4px 12px rgba(79,70,229,.35)}
.b-ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.b-ghost:hover{background:var(--soft)}
.b-danger{background:transparent;color:var(--danger);padding:6px}
.b-icon{padding:6px;border-radius:8px;background:transparent;color:var(--muted)}
.b-icon:hover{background:var(--soft);color:var(--pri)}
header{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 20px;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:-.3px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--pri),#8b5cf6);color:#fff;display:grid;place-items:center}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{background:transparent;color:var(--muted);padding:7px 14px;border-radius:9px}
.seg button.on{background:var(--surface);color:var(--pri);box-shadow:var(--shadow)}
.hact{display:flex;gap:8px}
.gallery{padding:16px 20px 6px;max-width:1560px;margin:0 auto}
.gal-h{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:10px}
.gal-h .mi{color:var(--pri)}
.tracks{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 12px;scroll-snap-type:x proximity}
.tcard{flex:0 0 240px;scroll-snap-align:center;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:8px;cursor:pointer;transition:.15s}
.tcard:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.tcard.on{border-color:var(--pri);box-shadow:0 0 0 3px var(--soft)}
.thumb{height:336px;position:relative;overflow:hidden;border:1px solid var(--line);border-radius:8px;background:#fff;margin-bottom:8px}
.paper.mini{position:absolute;top:0;left:0;transform:scale(.3);transform-origin:0 0;box-shadow:none;pointer-events:none;height:1123px;overflow:hidden}
.use{display:none;position:absolute;left:50%;bottom:12px;transform:translateX(-50%)}
.tcard.on .use{display:inline-flex}
.tname{font-size:12.5px;font-weight:700}.tmeta{font-size:11px;color:var(--muted);margin-top:1px}
.cats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.pill{background:var(--surface);color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:12px}
.pill.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.x-tl section{border-left:2px solid var(--tc);padding-left:14px;margin-left:4px;position:relative}
.x-tl section:before{content:'';position:absolute;left:-6px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--tc)}
.x-bn section{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:10px 14px;margin-top:10px}
.x-bn h2{margin-top:0}
.x-sw h1{font-size:34px;text-transform:uppercase;letter-spacing:-1px;font-weight:900}
.x-sw h2{background:#000;color:#fff!important;border:0;display:inline-block;padding:2px 8px}
main{max-width:1560px;margin:0 auto;padding:10px 20px 24px;display:grid;grid-template-columns:480px minmax(0,1fr);gap:20px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:700}
.ph span.t{display:flex;align-items:center;gap:8px}.ph .mi{color:var(--pri)}
#forms{padding:14px;max-height:calc(100vh - 220px);overflow:auto;display:flex;flex-direction:column;gap:12px}
.fc{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.fh{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--bg);border-bottom:1px solid var(--line);font-weight:700;font-size:13px}
.fh input.tt{flex:1;border:0;background:transparent;font-weight:700;padding:4px;min-width:0}
.fh .mi{color:var(--muted);font-size:19px}
.fh .drag{cursor:grab}
.fb{padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g{display:flex;flex-direction:column;gap:4px}.full{grid-column:1/-1}
label{font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
input,select,textarea{width:100%;font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 3px var(--soft)}
textarea{min-height:70px;resize:vertical;line-height:1.45}
input[type=checkbox]{width:auto}input[type=color]{padding:2px;height:30px;width:34px}
.fmt{display:flex;align-items:center;gap:6px;padding:6px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.fmt .b-icon.on{background:var(--soft);color:var(--pri)}
.row{display:flex;gap:6px;align-items:center}
.sub{border:1px dashed var(--line);border-radius:10px;padding:8px;display:grid;gap:6px}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:10px 14px;background:var(--soft);border-bottom:1px solid var(--line)}
.chips button{background:var(--surface);color:var(--pri);border:1px solid var(--line);padding:6px 10px;font-size:12px}
.info{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:#16a34a;margin-right:6px;white-space:nowrap}.info.warn{color:#dc2626}.info .mi{font-size:16px}
.paper .photo.ph-round,.paper .slot.ph-round{width:100px;height:100px;border-radius:50%}
.paper .photo.ph-square,.paper .slot.ph-square{width:100px;height:100px;border-radius:2px}
.paper .photo.ph-rounded,.paper .slot.ph-rounded{width:100px;height:100px;border-radius:18%}
.paper .photo.ph-passport,.paper .slot.ph-passport{width:88px;height:106px;border-radius:4px}
.modal{position:fixed;inset:0;z-index:300;background:rgba(2,6,23,.6);display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}
.modal[hidden]{display:none}
.mbox{background:var(--surface);border-radius:18px;width:100%;max-width:380px;box-shadow:0 24px 60px rgba(0,0,0,.5);padding:16px;display:flex;flex-direction:column;gap:12px;max-height:94vh;overflow:auto}
.mh{display:flex;align-items:center;gap:8px;font-weight:700}.mh .mi{color:var(--pri)}.mh .b-icon{margin-left:auto}
.cwrap{background:repeating-conic-gradient(#e5e7eb 0 25%,#f8fafc 0 50%) 0 0/16px 16px;border-radius:12px;padding:14px;display:grid;place-items:center}
.cframe{position:relative;overflow:hidden;background:#000;touch-action:none;cursor:grab;box-shadow:0 0 0 3px #fff,0 0 0 4px var(--pri)}
.cframe img{position:absolute;max-width:none;user-select:none;-webkit-user-drag:none;pointer-events:none}
.shapes{display:flex;gap:8px}.shapes button{flex:1;min-width:0;padding-left:2px;padding-right:2px;flex-direction:column;gap:2px;font-size:11px;background:var(--bg);color:var(--muted);border:1px solid var(--line);padding:8px 4px}
.shapes button.on{background:var(--soft);color:var(--pri);border-color:var(--pri)}
.srow{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}.srow .mi{color:var(--pri)}.srow span.l{width:58px;font-weight:600}
input[type=range]{padding:0;border:0;height:26px;accent-color:var(--pri);background:transparent;flex:1}
.mf{display:flex;gap:8px;justify-content:flex-end}
.menu{position:fixed;z-index:200;width:220px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column}
.menu button{background:transparent;color:var(--ink);justify-content:flex-start;padding:10px}.menu button:hover{background:var(--soft)}
.fh .b-icon.on{background:var(--soft);color:var(--pri)}
.pv{position:sticky;top:70px;height:calc(100vh - 90px);display:flex;flex-direction:column}
.pwrap{flex:1;overflow:auto;background:#475569;padding:22px 14px;display:flex;flex-direction:column;align-items:center}
.ptool{display:flex;align-items:center;gap:4px}
.zoomval{min-width:44px;text-align:center;font-size:12px;font-weight:600}

/* ===== A4 PAPER ===== */
.paper{width:794px;min-height:1123px;background:#fff;color:#1e293b;font-family:'Segoe UI',Roboto,sans-serif;box-shadow:0 12px 40px rgba(0,0,0,.45);position:relative;flex-shrink:0;-webkit-print-color-adjust:exact;print-color-adjust:exact;--tc:#2563eb}
.paper .mi{font-size:13px;margin-right:4px;vertical-align:-2px}
.paper h1{font-size:25px;font-weight:800;line-height:1.15;color:#0f172a}
.paper h2{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.9px;color:var(--tc);border-bottom:1.5px solid var(--tc);padding-bottom:3px;margin:14px 0 6px}
.paper p,.paper li{font-size:11px;line-height:1.5;color:#334155}
.paper ul{padding-left:16px;margin:3px 0}
.role{font-size:12.5px;font-weight:700;color:var(--tc);margin:3px 0 5px}
.ct{font-size:10.5px;color:#475569;line-height:1.7}
.doct{font-size:19px;font-weight:900;letter-spacing:2px;text-transform:uppercase;margin-bottom:12px}
.doct.u{border-bottom:2px solid #0f172a;display:inline-block;padding-bottom:3px}
.pad{padding:42px 46px}
.photo{width:88px;height:106px;object-fit:cover;border:2px solid var(--tc);border-radius:6px;flex-shrink:0}
.slot{width:88px;height:106px;border:1.5px dashed #94a3b8;border-radius:6px;display:grid;place-items:center;text-align:center;font-size:9px;font-weight:700;color:#64748b;background:#f8fafc;flex-shrink:0}
.tbl{width:100%;border-collapse:collapse;margin:5px 0}
.tbl th{background:#f1f5f9;text-align:left;padding:5px 7px;border:1px solid #cbd5e1;font-size:9.5px;text-transform:uppercase}
.tbl td{padding:5px 7px;border:1px solid #cbd5e1;font-size:10.5px}
.grid3{display:grid;grid-template-columns:190px 12px 1fr;row-gap:5px;font-size:11px}
.grid3 b{text-transform:uppercase;font-size:10.5px}
.sign{display:flex;justify-content:space-between;align-items:flex-end;margin-top:16px;font-size:10.5px}
.dongle{margin-top:18px;padding-top:6px;border-top:1px dashed #cbd5e1;font-size:9.5px;color:#64748b;display:flex;justify-content:space-between}
.sl{display:grid;grid-template-columns:240px 1fr;min-height:var(--ph,1123px)}
.sl aside{background:var(--tc);color:#fff;padding:36px 20px}.sl aside *{color:#fff!important;border-color:rgba(255,255,255,.35)!important}
.sl aside .photo,.sl aside .slot{border-radius:50%;width:92px;height:92px;margin:0 auto 12px;display:grid;border-color:#fff}
.sl main{display:block;padding:36px 26px;max-width:none;margin:0}
.sr{display:grid;grid-template-columns:1fr 230px;min-height:var(--ph,1123px)}
.sr main{display:block;padding:36px 26px;max-width:none;margin:0}
.sr aside{background:#f8fafc;border-left:2px solid #e2e8f0;padding:36px 18px}
.hero .hb{background:var(--tc);padding:30px 44px;display:flex;justify-content:space-between;align-items:center;gap:14px}
.hero .hb *{color:#fff!important;border-color:rgba(255,255,255,.4)!important}
.hero .bd{padding:6px 44px 36px}
.band{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;padding:4px 8px;margin:12px 0 6px;background:color-mix(in srgb,var(--tc) 14%,#fff);border-left:4px solid var(--tc)}
.aus{text-align:center;font-weight:800;font-size:15px;margin-bottom:8px;color:var(--tc)}
.b-box{border:1.5px solid #000}.b-gold{border:10px double #b45309;background:#fffdfa}.b-green{border:4px solid #0f766e}
.fs-s p,.fs-s li{font-size:10px!important}.fs-l p,.fs-l li{font-size:12px!important}
.sp-c h2,.sp-c .band{margin-top:8px!important}.sp-c p,.sp-c li{line-height:1.35!important}

.nav{display:none}
@media(max-width:900px){
 header{padding:8px 12px}.hact{display:none}.brand span.n{font-size:15px}
 main{grid-template-columns:1fr;padding:8px}.gallery{padding:10px 12px 0}
 #forms{max-height:none}.pv{position:static;height:auto}
 body.v-form .gallery,body.v-form .pv{display:none}
 body.v-tpl .edit,body.v-tpl .pv,body.v-tpl main{display:none}
 body.v-tpl .tracks{flex-wrap:wrap;justify-content:center;overflow:visible}
 body.v-prev .gallery,body.v-prev .edit{display:none}
 .fb{grid-template-columns:1fr}
 body{padding-bottom:78px}
 .nav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around}
 .nav button{flex:1;flex-direction:column;gap:2px;background:transparent;color:var(--muted);font-size:11px;padding:6px 2px}
 .nav button.on{color:var(--pri);background:var(--soft)}
}
@media print{
 @page{size:A4;margin:0}
 body{background:#fff;padding:0}
 header,.gallery,.edit,.ph,.nav,.ptool{display:none!important}
 main{display:block;padding:0;margin:0}.panel{border:0;box-shadow:none;border-radius:0}
 .pv{position:static;height:auto}.pwrap{padding:0;background:#fff;overflow:visible}
 html,body{height:auto!important}
 .paper{zoom:1!important;box-shadow:none;margin:0;width:210mm!important}
 .paper.one{height:296mm!important;overflow:hidden!important;page-break-after:avoid;break-inside:avoid}
 .menu{display:none!important}
}
</style>
</head>
<body class="v-form">

<header>
  <div class="brand"><div class="logo"><span class="mi">description</span></div><span class="n">Arpana Resume Maker</span></div>
  <div class="seg">
    <button id="m-res" class="on"><span class="mi">article</span>Resume</button>
    <button id="m-bio"><span class="mi">diversity_1</span>Biodata</button>
  </div>
  <div class="hact">
    <button class="b-ghost" id="b-rst"><span class="mi">restart_alt</span>Reset</button>
    <button class="b-ghost" id="b-load"><span class="mi">folder_open</span>Load</button>
    <button class="b-ghost" id="b-save"><span class="mi">save</span>Save</button>
    <button class="b-pri" id="b-pdf"><span class="mi">picture_as_pdf</span>Download PDF</button>
  </div>
  <input type="file" id="json-in" accept=".json" hidden>
</header>

<section class="gallery">
  <div class="gal-h"><span class="mi">palette</span><span id="gal-t">Resume Templates</span></div>
  <div class="cats" id="cats"></div>
  <div class="tracks" id="tracks"></div>
</section>

<main>
  <section class="panel edit">
    <div class="ph"><span class="t"><span class="mi">edit_note</span><span id="ed-t">Resume Details</span></span>
      <button class="b-ghost" id="b-add"><span class="mi">add</span>Section</button></div>
    <div class="chips" id="chips"></div>
    <div id="forms"></div>
  </section>

  <section class="panel pv">
    <div class="ph"><span class="t"><span class="mi">visibility</span><span id="pv-t">Preview</span></span>
      <div class="ptool"><span id="pg-info" class="info"></span>
        <button class="b-icon" id="z-out"><span class="mi">zoom_out</span></button>
        <span class="zoomval" id="z-val">100%</span>
        <button class="b-icon" id="z-in"><span class="mi">zoom_in</span></button>
        <button class="b-icon" id="z-fit"><span class="mi">fit_screen</span></button>
        <button class="b-pri" id="b-pdf2" style="padding:6px 12px"><span class="mi">download</span>PDF</button>
      </div></div>
    <div class="pwrap" id="pwrap"><article class="paper" id="paper"></article></div>
  </section>
</main>

<div class="modal" id="cropm" hidden><div class="mbox">
 <div class="mh"><span class="mi">crop</span>Crop & adjust photo<button class="b-icon" id="cm-x"><span class="mi">close</span></button></div>
 <div class="cwrap"><div class="cframe" id="cframe"><img id="cimg" alt=""></div></div>
 <div class="shapes" id="cshapes">
  <button data-sh="round"><span class="mi">circle</span>Round</button><button data-sh="square"><span class="mi">crop_square</span>Square</button><button data-sh="rounded"><span class="mi">rounded_corner</span>Rounded</button><button data-sh="passport"><span class="mi">crop_portrait</span>Passport</button></div>
 <div class="srow"><span class="mi">zoom_in</span><span class="l">Zoom</span><input type="range" id="cz" min="1" max="3" step="0.01" value="1"></div>
 <div class="srow"><span class="mi">swap_horiz</span><span class="l">Left / Right</span><input type="range" id="cx" min="-1" max="1" step="0.01" value="0"></div>
 <div class="srow"><span class="mi">swap_vert</span><span class="l">Up / Down</span><input type="range" id="cy" min="-1" max="1" step="0.01" value="0"></div>
 <div class="mf"><button class="b-ghost" id="cm-reset"><span class="mi">restart_alt</span>Reset</button><button class="b-ghost" id="cm-cancel">Cancel</button><button class="b-pri" id="cm-ok"><span class="mi">check</span>Apply</button></div>
</div></div>
<nav class="nav" id="nav">
  <button data-v="form" class="on"><span class="mi">edit_note</span>Form</button>
  <button data-v="tpl"><span class="mi">palette</span>Templates</button>
  <button data-v="prev"><span class="mi">visibility</span>Preview</button>
  <button data-v="pdf"><span class="mi">picture_as_pdf</span>PDF</button>
</nav>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rich=s=>esc(s).replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\*(.*?)\*/g,'<em>$1</em>').replace(/__(.*?)__/g,'<u>$1</u>');
const lines=s=>String(s||'').split('\n').map(x=>x.replace(/^[•\-\s]+/,'').trim()).filter(Boolean);
const ico=n=>`<span class="mi">${n}</span>`;

const RT=[
[1,'Professional Green Sidebar','30/70 left column','sl','#0f766e','sidebar'],
[2,'Two-Tone 50/50 Dual Column','Canva trending','sp','#2563eb','creative'],
[3,'Connected Timeline Flow','Career roadmap dots','tl','#2563eb','creative'],
[4,'Modern Bento Cards','Boxed modules','bn','#4f46e5','creative'],
[5,'Full-Bleed Top Banner','Navy header strip','hero','#1e3a8a','creative'],
[6,'Right Sidebar Pro','70/30 right highlights','sr','#4f46e5','sidebar'],
[7,'Swiss High-Contrast Bold','Black & white type','sw','#000000','ats'],
[8,'Dark Sidebar Impact','Charcoal left column','sl','#0f172a','sidebar'],
[9,'Modern Fresher Table','Photo right + marks table','std','#2563eb','fresher'],
[10,'Traditional Georgia Serif','Classic editorial','std','#1e293b','classic','Georgia,serif'],
[11,'Clean Slate Sidebar','Light slate rail','sl','#334155','sidebar'],
[12,'Corporate MNC ATS','100% parser safe','std','#0f172a','ats'],
[13,'Teacher Academic CV','B.Ed, CTET, pedagogy','std','#7c3aed','classic','Georgia,serif'],
[14,'Emerald Finance Specialist','CA & banking','std','#047857','classic'],
[15,'Developer Tech Cards','Tools & frameworks','bn','#0ea5e9','creative'],
[16,'Executive Double Rule','Navy dividers','std','#1e3a8a','classic','Georgia,serif'],
[17,'Nordic Minimalist Gray','Soft gray lines','std','#64748b','ats'],
[18,'Teal Accent Resume','Fresh teal headings','std','#0d9488','ats'],

function fitPage(){
 const p=$('paper'),w=$('pfit');if(!w)return;
 const z=p.style.zoom;p.style.zoom=1;
 const on=st.fit!==false,A=1123;
 const ap=(sc,ph)=>{w.style.cssText=`width:${794/sc}px;transform:scale(${sc});transform-origin:0 0;--ph:${ph}px`};
 let sc=1,hh=0;
 for(let i=0;i<5;i++){ap(sc,0);hh=w.offsetHeight*sc;
  if(!on)break;
  if(hh>A+.5||(sc<1&&hh<A-5))sc=Math.min(1,Math.max(.5,sc*A/hh));else break}
 if(!on)sc=1;
 ap(sc,A/sc);
 p.classList.toggle('one',on);p.style.height=on?A+'px':'';p.style.overflow=on?'hidden':'';
 p.style.zoom=z;
 const bad=on&&hh>A+2;
 $('pg-info').className='info'+(bad?' warn':'');
 $('pg-info').innerHTML=!on?`<span class="mi">description</span>Auto-fit off`:bad?`<span class="mi">warning</span>Too long for 1 page`:`<span class="mi">check_circle</span>1 page${sc<.995?' · '+Math.round(sc*100)+'%':''}`}

  return`<div class="fc" draggable="true" data-dk="${k}"><div class="fh"><span class="mi drag">drag_indicator</span><input class="tt" data-r="${k}" value="${esc(s.t)}"><button class="b-icon" data-act="up" data-k="${k}"><span class="mi">arrow_upward</span></button><button class="b-icon" data-act="dn" data-k="${k}"><span class="mi">arrow_downward</span></button><button class="b-icon ${x.hide?'on':''}" data-act="hide" data-k="${k}" title="Show / hide layer"><span class="mi">${x.hide?'visibility_off':'visibility'}</span></button><button class="b-icon" data-act="dup" data-k="${k}" title="Duplicate section"><span class="mi">content_copy</span></button><button class="b-icon" data-act="del" data-k="${k}"><span class="mi">delete</span></button></div>${fmt}<div class="fb">${b}</div></div>`}).join('');
 $('s-font').value=st.font;$('s-fs').value=st.fs;$('s-sp').value=st.sp;$('s-photo').value=st.photoMode;$('i-title').value=st.title;$('s-align').value=st.align;
 $('c-ul').checked=st.ul;$('c-yr').checked=st.yr;$('c-mk').checked=st.mk;$('c-dg').checked=st.dong;$('s-shape').value=st.photoShape||'';$('c-fit').checked=st.fit!==false;$('dg-box').style.display=st.dong?'grid':'none';$('i-dt').value=st.dTrack;$('i-dn').value=st.dNote;
 if($('i-aus'))$('i-aus').value=st.aus;
 bindDrag()}

let drag=null;
function bindDrag(){document.querySelectorAll('[data-dk]').forEach(c=>{
 c.ondragstart=()=>{drag=c.dataset.dk;c.style.opacity=.4};c.ondragend=()=>{c.style.opacity=1};c.ondragover=e=>e.preventDefault();
 c.ondrop=e=>{e.preventDefault();const to=c.dataset.dk;if(drag&&drag!==to){const a=st.order.indexOf(drag),b=st.order.indexOf(to);st.order.splice(a,1);st.order.splice(b,0,drag);drawForms();upd()}}})}

function chips(){
 $('chips').innerHTML=st.mode==='resume'
 ?`<button data-p="r1"><span class="mi">work</span>Professional</button><button data-p="r2"><span class="mi">school</span>Fresher</button>`
 :`<button data-p="b1"><span class="mi">gavel</span>Job biodata</button><button data-p="b2"><span class="mi">favorite</span>Marriage biodata</button>`;
 $('ed-t').textContent=st.mode==='resume'?'Resume Details':'Biodata Details'}

function upd(){drawPaper();clearTimeout(gt);gt=setTimeout(drawGallery,300);try{localStorage.setItem('arpana_'+st.mode,JSON.stringify(st))}catch(e){}}

/* ---------- EVENTS ---------- */
const F=$('forms');
F.addEventListener('input',e=>{const el=e.target,d=el.dataset;
 if(el.id==='i-title')st.title=el.value;else if(el.id==='i-aus')st.aus=el.value;else if(el.id==='i-dt')st.dTrack=el.value;else if(el.id==='i-dn')st.dNote=el.value;
 else if(d.h)st.sections.head[d.h]=el.value;
 else if(d.r)st.sections[d.r].t=el.value;
 else if(d.s)st.sections[d.s].v=el.value;
 else if(d.t)st.sections[d.t].rows[+d.i][d.f]=el.value;
 else if(d.g)st.sections[d.g].items[+d.i][d.f]=el.value;
 else if(d.d)st.sections[d.d][d.f]=el.value;
 else if(d.c){const s=st.sections[d.c];s.style=s.style||sty();s.style.color=el.value}
 else return;
 upd()});
F.addEventListener('change',e=>{const id=e.target.id,v=e.target.value,ck=e.target.checked;if(e.target.dataset.ha!==undefined){st.sections.head.align=v;upd();return}
 if(id==='s-font')st.font=v;else if(id==='s-fs')st.fs=v;else if(id==='s-sp')st.sp=v;else if(id==='s-photo')st.photoMode=v;else if(id==='s-align')st.align=v;
 else if(id==='c-ul')st.ul=ck;else if(id==='c-yr'){st.yr=ck;drawForms()}else if(id==='c-mk'){st.mk=ck;drawForms()}
 else if(id==='c-fit')st.fit=ck;
 else if(id==='c-dg'){st.dong=ck;$('dg-box').style.display=ck?'grid':'none'}
 else if(id==='s-shape'){st.photoShape=v;recrop();return}
 else if(id==='i-photo'){loadPhoto(e.target.files[0]);e.target.value='';return}
 else return;
 upd()});
F.addEventListener('click',e=>{const b=e.target.closest('button[data-act]');if(!b)return;const a=b.dataset.act,k=b.dataset.k,i=+b.dataset.i,o=st.order,ix=o.indexOf(k);const S=()=>{const q=st.sections[k];q.style=q.style||sty();return q.style};
 if(a==='up'&&ix>0)[o[ix-1],o[ix]]=[o[ix],o[ix-1]];
 else if(a==='dn'&&ix<o.length-1)[o[ix+1],o[ix]]=[o[ix],o[ix+1]];
 else if(a==='del'){st.order=o.filter(x=>x!==k);delete st.sections[k]}
 else if(a==='addrow')st.sections[k].rows.push({course:'',school:'',year:'',marks:''});
 else if(a==='delrow')st.sections[k].rows.splice(i,1);
 else if(a==='additem')st.sections[k].items.push({l:'Label',v:''});
 else if(a==='delitem')st.sections[k].items.splice(i,1);
 else if(a==='align'){const x=S();x.align=x.align===b.dataset.v?'':b.dataset.v}
 else if(a==='noT'||a==='hide'){const x=S();x[a]=!x[a]}
 else if(a==='dup'){const nk='sec_'+Date.now();const c=JSON.parse(JSON.stringify(st.sections[k]));c.t+=' (copy)';st.sections[nk]=c;o.splice(ix+1,0,nk)}
 else if(a==='duprow'){const r=st.sections[k].rows;r.splice(i+1,0,{...r[i]})}
 else if(a==='dupitem'){const r=st.sections[k].items;r.splice(i+1,0,{...r[i]})}
 else if(a==='bold'||a==='italic'){const s=st.sections[k];s.style=s.style||sty();s.style[a]=!s.style[a]}
 drawForms();upd()});

const NEW={text:{t:'New Text',k:'text',v:'Write here...'},lines:{t:'New List',k:'lines',v:'First point\nSecond point'},grid:{t:'New Fields',k:'grid',items:[{l:'Label',v:'Detail'}]},table:{t:'New Table',k:'table',rows:[{course:'',school:'',year:'',marks:''}]},note:{t:'Free Text',k:'text',v:'Your custom text',noT:1}};
$('b-add').onclick=e=>{e.stopPropagation();let m=$('addmenu');if(m){m.remove();return}m=document.createElement('div');m.id='addmenu';m.className='menu';
 m.innerHTML=[['text','notes','Text paragraph'],['lines','format_list_bulleted','Bullet list'],['grid','view_list','Label : value fields'],['table','table_chart','Table'],['note','text_fields','Free text (no title)']].map(([k,i,n])=>`<button data-n="${k}"><span class="mi">${i}</span>${n}</button>`).join('');
 document.body.appendChild(m);const r=$('b-add').getBoundingClientRect();m.style.top=r.bottom+6+'px';m.style.left=Math.max(8,r.right-220)+'px'};
document.addEventListener('click',e=>{const m=$('addmenu');if(!m)return;const b=e.target.closest('#addmenu button');
 if(b){const d=JSON.parse(JSON.stringify(NEW[b.dataset.n])),x=sty();if(d.noT){x.noT=true;delete d.noT}d.style=x;const k='sec_'+Date.now();st.sections[k]=d;st.order.push(k);drawForms();upd();F.scrollTop=F.scrollHeight}
 m.remove()});

$('tracks').addEventListener('click',e=>{const c=e.target.closest('.tcard');if(!c)return;st.tpl=+c.dataset.id;if(st.photoRaw&&!st.photoShape)recrop();drawPaper();drawGallery();
 if(e.target.closest('[data-use]')){innerWidth<=900?setView('prev'):$('forms').scrollIntoView({behavior:'smooth',block:'start'})}});
$('cats').addEventListener('click',e=>{const b=e.target.closest('.pill');if(!b)return;cat=b.dataset.cat;drawGallery()});

$('chips').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const p=b.dataset.p;
 if(p[0]==='r'){st=resumeState();if(p==='r2'){st.tpl=6;st.sections.head.role='Fresher / B.Com Graduate'}}
 else{st=bioState();if(p==='b2'){st.tpl=102;st.title='BIO-DATA';st.ul=true}}
 chips();drawForms();upd()});

function switchMode(m){if(st.mode===m)return;st=m==='resume'?resumeState():bioState();cat='all';
 $('m-res').classList.toggle('on',m==='resume');$('m-bio').classList.toggle('on',m==='biodata');
 chips();drawForms();upd()}
$('m-res').onclick=()=>switchMode('resume');$('m-bio').onclick=()=>switchMode('biodata');

function applyZoom(){$('paper').style.zoom=zoom;$('z-val').textContent=Math.round(zoom*100)+'%'}
function fit(){const w=$('pwrap').clientWidth-28;zoom=Math.min(1,Math.max(.35,w/794));applyZoom()}
$('z-in').onclick=()=>{zoom=Math.min(1.4,zoom+.08);applyZoom()};
$('z-out').onclick=()=>{zoom=Math.max(.35,zoom-.08);applyZoom()};
$('z-fit').onclick=fit;
$('b-pdf').onclick=$('b-pdf2').onclick=()=>print();
addEventListener('resize',fit);

$('b-save').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(st,null,2)],{type:'application/json'}));a.download=`${st.mode}-${Date.now()}.json`;a.click();URL.revokeObjectURL(a.href)};
$('b-load').onclick=()=>$('json-in').click();
$('json-in').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.sections||!d.order)throw 0;st=d;
 $('m-res').classList.toggle('on',st.mode==='resume');$('m-bio').classList.toggle('on',st.mode==='biodata');chips();drawForms();upd()}catch(x){alert('Invalid file')}};r.readAsText(f)};
$('b-rst').onclick=()=>{if(confirm('Reset to default sample?')){st=st.mode==='resume'?resumeState():bioState();drawForms();upd()}};

function setView(v){document.body.className='v-'+v;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));if(v==='prev')setTimeout(fit,80)}
$('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;b.dataset.v==='pdf'?print():setView(b.dataset.v)});

/* ---------- PHOTO CROP ---------- */
const CR={img:null,z:1,x:0,y:0,sh:'passport'};
const DIM=sh=>sh==='passport'?[400,480]:[400,400];
const RAD={round:'50%',square:'2px',rounded:'18%',passport:'4px'};
const shapeNow=()=>st.photoShape||(curTpl().e==='sl'?'round':'passport');
function lay(img,c,W,H){const nw=img.naturalWidth,nh=img.naturalHeight,k=Math.max(W/nw,H/nh)*c.z,dw=nw*k,dh=nh*k;return{dw,dh,l:(W-dw)/2+c.x*(dw-W)/2,t:(H-dh)/2+c.y*(dh-H)/2}}
function renderCrop(img,sh,c){const [W,H]=DIM(sh),cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d'),L=lay(img,c,W,H);x.fillStyle='#fff';x.fillRect(0,0,W,H);x.drawImage(img,L.l,L.t,L.dw,L.dh);return cv.toDataURL('image/jpeg',.92)}
function withRaw(fn){if(!st.photoRaw)return;const i=new Image();i.onload=()=>fn(i);i.src=st.photoRaw}
function recrop(){if(!st.photoRaw){upd();return}withRaw(i=>{st.photo=renderCrop(i,shapeNow(),st.photoCrop||{z:1,x:0,y:0});upd()})}
function loadPhoto(f){if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const m=Math.min(1,1000/Math.max(i.naturalWidth,i.naturalHeight)),cv=document.createElement('canvas');cv.width=Math.round(i.naturalWidth*m);cv.height=Math.round(i.naturalHeight*m);cv.getContext('2d').drawImage(i,0,0,cv.width,cv.height);
 st.photoRaw=cv.toDataURL('image/jpeg',.9);st.photoCrop={z:1,x:0,y:0};st.photoMode='real';$('s-photo').value='real';withRaw(im=>{st.photo=renderCrop(im,shapeNow(),st.photoCrop);upd();openCrop()})};i.src=r.result};r.readAsDataURL(f)}
function cSync(){$('cz').value=CR.z;$('cx').value=CR.x;$('cy').value=CR.y;document.querySelectorAll('#cshapes button').forEach(b=>b.classList.toggle('on',b.dataset.sh===CR.sh));
 const [w,h]=DIM(CR.sh),Wf=240,Hf=Wf*h/w,f=$('cframe'),L=lay(CR.img,CR,Wf,Hf),im=$('cimg');f.style.width=Wf+'px';f.style.height=Hf+'px';f.style.borderRadius=RAD[CR.sh];
 Object.assign(im.style,{width:L.dw+'px',height:L.dh+'px',left:L.l+'px',top:L.t+'px'})}
function openCrop(){withRaw(i=>{CR.img=i;const c=st.photoCrop||{z:1,x:0,y:0};CR.z=c.z;CR.x=c.x;CR.y=c.y;CR.sh=shapeNow();$('cimg').src=st.photoRaw;$('cropm').hidden=false;cSync()})}
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
$('cz').oninput=e=>{CR.z=+e.target.value;cSync()};$('cx').oninput=e=>{CR.x=+e.target.value;cSync()};$('cy').oninput=e=>{CR.y=+e.target.value;cSync()};
$('cshapes').onclick=e=>{const b=e.target.closest('button');if(!b)return;CR.sh=b.dataset.sh;cSync()};
$('cm-reset').onclick=()=>{CR.z=1;CR.x=0;CR.y=0;cSync()};
$('cm-cancel').onclick=$('cm-x').onclick=()=>{$('cropm').hidden=true};
$('cropm').addEventListener('click',e=>{if(e.target.id==='cropm')$('cropm').hidden=true});
$('cm-ok').onclick=()=>{st.photoShape=CR.sh;st.photoCrop={z:CR.z,x:CR.x,y:CR.y};st.photo=renderCrop(CR.img,CR.sh,st.photoCrop);st.photoMode='real';$('s-shape').value=CR.sh;$('s-photo').value='real';$('cropm').hidden=true;upd()};
let dr=null;
$('cframe').addEventListener('pointerdown',e=>{dr={x:e.clientX,y:e.clientY};e.currentTarget.setPointerCapture(e.pointerId)});
$('cframe').addEventListener('pointermove',e=>{if(!dr)return;const [w,h]=DIM(CR.sh),Wf=240,Hf=Wf*h/w,L=lay(CR.img,CR,Wf,Hf),ox=(L.dw-Wf)/2,oy=(L.dh-Hf)/2;
 if(ox>1)CR.x=clamp(CR.x+(e.clientX-dr.x)/ox,-1,1);if(oy>1)CR.y=clamp(CR.y+(e.clientY-dr.y)/oy,-1,1);dr={x:e.clientX,y:e.clientY};cSync()});
$('cframe').addEventListener('pointerup',()=>{dr=null});
F.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.id==='b-up')$('i-photo').click();
 else if(b.id==='b-crop'){st.photoRaw?openCrop():$('i-photo').click()}
 else if(b.id==='b-rmph'){st.photo='';st.photoRaw='';st.photoCrop=null;upd()}});

chips();drawForms();upd();setTimeout(fit,200);
addEventListener('beforeprint',fitPage);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{fitPage();fit()});
</script>
</body>
